name: SEO Quality Gate & Build Verification

on:
  push:
    branches: [main, "seo/*", "feat/*"]
  pull_request:
    branches: [main]

jobs:
  seo-qa:
    name: SEO QA & Static Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npm run type-check

      - name: ESLint Code Quality
        run: npm run lint -- --dir src

      - name: Automated SEO QA Suite
        run: npm run seo:qa

      - name: Next.js Production Build
        run: npm run build
