<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" role="img" aria-label="Team collaboration illustration">
  <defs>
    <pattern id="dotGrid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2e6e5e" opacity="0.09"/>
    </pattern>
    <radialGradient id="orangeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d9632a" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#d9632a" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#d9632a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2e6e5e" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#2e6e5e" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#2e6e5e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="avatarOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec9367"/>
      <stop offset="100%" stop-color="#c2551e"/>
    </linearGradient>
    <linearGradient id="avatarGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5fa193"/>
      <stop offset="100%" stop-color="#2e6e5e"/>
    </linearGradient>
    <linearGradient id="avatarDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3833"/>
      <stop offset="100%" stop-color="#1b1a17"/>
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbf8f2"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#dotGrid)"/>
  <circle cx="660" cy="120" r="240" fill="url(#orangeGlow)"/>
  <circle cx="140" cy="490" r="220" fill="url(#greenGlow)"/>

  <g stroke-width="1.5" fill="none" stroke-linecap="round" stroke-dasharray="4 6">
    <path d="M 200 240 Q 320 180 420 220" stroke="#d9632a" stroke-opacity="0.5"/>
    <path d="M 420 220 Q 520 280 600 240" stroke="#2e6e5e" stroke-opacity="0.5"/>
    <path d="M 200 240 Q 280 380 400 420" stroke="#d9632a" stroke-opacity="0.4"/>
    <path d="M 600 240 Q 540 380 400 420" stroke="#2e6e5e" stroke-opacity="0.4"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="270" y="320" width="260" height="150" rx="20" fill="url(#cardGradient)" stroke="#ebe4d6"/>
    <rect x="290" y="340" width="100" height="6" rx="3" fill="#d9632a"/>
    <rect x="290" y="358" width="220" height="4" rx="2" fill="#1b1a17" fill-opacity="0.16"/>
    <rect x="290" y="372" width="180" height="4" rx="2" fill="#1b1a17" fill-opacity="0.12"/>
    <g transform="translate(290 400)">
      <circle cx="10" cy="10" r="10" fill="#d9632a"/>
      <circle cx="30" cy="10" r="10" fill="#2e6e5e"/>
      <circle cx="50" cy="10" r="10" fill="#1b1a17" fill-opacity="0.85"/>
    </g>
    <rect x="350" y="404" width="80" height="8" rx="4" fill="#2e6e5e" fill-opacity="0.28"/>
    <rect x="290" y="430" width="180" height="4" rx="2" fill="#1b1a17" fill-opacity="0.12"/>
  </g>

  <g filter="url(#softShadow)">
    <circle cx="200" cy="240" r="46" fill="url(#avatarOrange)"/>
    <circle cx="200" cy="222" r="14" fill="#ffffff" fill-opacity="0.85"/>
    <path d="M 170 268 Q 200 240 230 268" fill="#ffffff" fill-opacity="0.85"/>
  </g>
  <g filter="url(#softShadow)">
    <circle cx="420" cy="195" r="50" fill="url(#avatarGreen)"/>
    <circle cx="420" cy="175" r="15" fill="#ffffff" fill-opacity="0.85"/>
    <path d="M 388 226 Q 420 195 452 226" fill="#ffffff" fill-opacity="0.85"/>
  </g>
  <g filter="url(#softShadow)">
    <circle cx="600" cy="240" r="44" fill="url(#avatarDark)"/>
    <circle cx="600" cy="223" r="13" fill="#ffffff" fill-opacity="0.9"/>
    <path d="M 572 268 Q 600 240 628 268" fill="#ffffff" fill-opacity="0.9"/>
  </g>

  <g fill="#d9632a">
    <circle cx="540" cy="140" r="3"/>
    <circle cx="120" cy="380" r="2.5"/>
    <circle cx="700" cy="380" r="3"/>
  </g>
  <g fill="#2e6e5e">
    <circle cx="280" cy="500" r="3"/>
    <circle cx="100" cy="180" r="2.5"/>
    <circle cx="650" cy="500" r="3"/>
  </g>
</svg>
