<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" role="img" aria-label="Solutions stack illustration">
  <defs>
    <pattern id="dotGrid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2e6e5e" opacity="0.09"/>
    </pattern>
    <radialGradient id="orangeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d9632a" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#d9632a" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#d9632a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2e6e5e" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#2e6e5e" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#2e6e5e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cubeOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec9367"/>
      <stop offset="100%" stop-color="#c2551e"/>
    </linearGradient>
    <linearGradient id="cubeGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5fa193"/>
      <stop offset="100%" stop-color="#2e6e5e"/>
    </linearGradient>
    <linearGradient id="cubeDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3833"/>
      <stop offset="100%" stop-color="#1b1a17"/>
    </linearGradient>
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#dotGrid)"/>
  <circle cx="660" cy="120" r="240" fill="url(#orangeGlow)"/>
  <circle cx="140" cy="490" r="220" fill="url(#greenGlow)"/>

  <g filter="url(#softShadow)">
    <path d="M 200 440 L 400 530 L 600 440 L 400 350 Z" fill="url(#cubeDark)"/>
    <path d="M 200 440 L 400 530 L 600 440 L 400 350 Z" fill="url(#topFace)"/>
    <text x="400" y="450" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">PERFORMANCE MARKETING</text>
    <text x="400" y="470" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.7">Meta Ads · CAPI · Tracking</text>
  </g>

  <g filter="url(#softShadow)">
    <path d="M 240 320 L 400 400 L 560 320 L 400 240 Z" fill="url(#cubeGreen)"/>
    <path d="M 240 320 L 400 400 L 560 320 L 400 240 Z" fill="url(#topFace)"/>
    <text x="400" y="335" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">AI AUTOMATION</text>
    <text x="400" y="355" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.85">n8n · GHL · Voice agents</text>
  </g>

  <g filter="url(#softShadow)">
    <path d="M 280 220 L 400 290 L 520 220 L 400 150 Z" fill="url(#cubeOrange)"/>
    <path d="M 280 220 L 400 290 L 520 220 L 400 150 Z" fill="url(#topFace)"/>
    <text x="400" y="232" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">WEB DEVELOPMENT</text>
    <text x="400" y="252" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.85">Next.js · SEO · CMS</text>
  </g>

  <g stroke-width="1.5" fill="none" stroke-linecap="round" stroke-dasharray="4 6">
    <path d="M 90 180 Q 200 200 270 220" stroke="#d9632a" stroke-opacity="0.5"/>
    <path d="M 710 200 Q 600 220 530 240" stroke="#d9632a" stroke-opacity="0.4"/>
    <path d="M 90 360 Q 180 340 250 330" stroke="#2e6e5e" stroke-opacity="0.5"/>
  </g>

  <g filter="url(#softShadow)">
    <circle cx="80" cy="180" r="22" fill="#ffffff" stroke="#ebe4d6"/>
    <path d="M 70 184 L 78 192 L 92 174" stroke="#d9632a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g filter="url(#softShadow)">
    <circle cx="80" cy="360" r="22" fill="#ffffff" stroke="#ebe4d6"/>
    <path d="M 70 364 L 78 372 L 92 354" stroke="#2e6e5e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g filter="url(#softShadow)">
    <circle cx="720" cy="200" r="22" fill="#ffffff" stroke="#ebe4d6"/>
    <path d="M 710 204 L 718 212 L 732 194" stroke="#d9632a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#d9632a">
    <circle cx="120" cy="120" r="3"/>
    <circle cx="680" cy="500" r="3"/>
  </g>
  <g fill="#2e6e5e">
    <circle cx="700" cy="440" r="3"/>
    <circle cx="120" cy="500" r="3"/>
  </g>
</svg>
