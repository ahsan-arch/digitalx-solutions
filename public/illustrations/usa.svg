<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" role="img" aria-label="USA operations illustration">
  <defs>
    <pattern id="dotGrid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2e6e5e" opacity="0.09"/>
    </pattern>
    <radialGradient id="orangeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d9632a" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#d9632a" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#d9632a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2e6e5e" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#2e6e5e" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#2e6e5e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="continentFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec9367"/>
      <stop offset="100%" stop-color="#c2551e"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbf8f2"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#dotGrid)"/>
  <circle cx="660" cy="120" r="240" fill="url(#orangeGlow)"/>
  <circle cx="140" cy="490" r="220" fill="url(#greenGlow)"/>

  <g filter="url(#softShadow)" transform="translate(120 130)">
    <path d="M 30 80 Q 60 50 110 60 L 200 50 Q 280 40 380 55 L 480 50 Q 540 60 560 90 L 555 120 Q 540 140 530 140 L 530 170 Q 545 195 540 215 L 530 240 Q 510 260 480 250 L 420 270 L 360 280 Q 300 285 240 270 L 180 265 Q 120 270 80 250 L 50 230 Q 30 200 35 170 L 30 130 Q 25 100 30 80 Z"
      fill="url(#continentFill)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.65"/>
    <path d="M 100 220 Q 90 240 80 270 L 70 290 Q 60 310 70 320" stroke="#ffffff" stroke-width="1" stroke-opacity="0.5" fill="none"/>
  </g>

  <g>
    <circle cx="540" cy="220" r="6" fill="#ffffff"/>
    <circle cx="540" cy="220" r="3" fill="#1b1a17"/>
    <circle cx="540" cy="220" r="14" fill="none" stroke="#1b1a17" stroke-opacity="0.4" stroke-dasharray="2 3"/>
    <circle cx="540" cy="220" r="22" fill="none" stroke="#1b1a17" stroke-opacity="0.22" stroke-dasharray="2 3"/>
  </g>

  <g filter="url(#softShadow)" transform="translate(80 380)">
    <rect width="220" height="140" rx="16" fill="url(#cardFill)" stroke="#ebe4d6"/>
    <rect x="20" y="20" width="60" height="6" rx="3" fill="#d9632a"/>
    <text x="20" y="58" font-family="sans-serif" font-size="22" font-weight="700" fill="#1b1a17">50 states</text>
    <text x="20" y="80" font-family="sans-serif" font-size="11" fill="#1b1a17" fill-opacity="0.6">PT · MT · CT · ET coverage</text>
    <g transform="translate(20 96)">
      <rect width="40" height="8" rx="4" fill="#d9632a"/>
      <rect x="44" width="40" height="8" rx="4" fill="#2e6e5e"/>
      <rect x="88" width="40" height="8" rx="4" fill="#1b1a17" fill-opacity="0.85"/>
    </g>
    <g transform="translate(20 116)">
      <circle cx="6" cy="6" r="6" fill="#2e6e5e"/>
      <rect x="20" y="2" width="80" height="8" rx="4" fill="#2e6e5e" fill-opacity="0.28"/>
    </g>
  </g>

  <g stroke-width="1.5" fill="none" stroke-dasharray="4 6" stroke-linecap="round">
    <path d="M 540 220 Q 480 240 420 220" stroke="#d9632a" stroke-opacity="0.5"/>
    <path d="M 540 220 Q 470 270 360 270" stroke="#2e6e5e" stroke-opacity="0.5"/>
    <path d="M 540 220 Q 590 280 600 360" stroke="#d9632a" stroke-opacity="0.4"/>
  </g>

  <g fill="#d9632a">
    <circle cx="420" cy="220" r="4"/>
    <circle cx="360" cy="270" r="4"/>
    <circle cx="600" cy="360" r="4"/>
  </g>
  <g fill="#1b1a17" font-family="sans-serif" font-size="11" font-weight="600">
    <text x="540" y="212">NEW YORK</text>
    <text x="395" y="240" fill="#1b1a17" fill-opacity="0.7">CHICAGO</text>
    <text x="335" y="290" fill="#1b1a17" fill-opacity="0.7">AUSTIN</text>
    <text x="600" y="380" fill="#1b1a17" fill-opacity="0.7">MIAMI</text>
  </g>
  <g fill="#2e6e5e">
    <circle cx="700" cy="240" r="3"/>
    <circle cx="650" cy="500" r="3"/>
  </g>
</svg>
