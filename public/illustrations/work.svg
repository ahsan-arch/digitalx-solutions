<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" role="img" aria-label="Case studies portfolio illustration">
  <defs>
    <pattern id="dotGrid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2e6e5e" opacity="0.09"/>
    </pattern>
    <radialGradient id="orangeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d9632a" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#d9632a" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#d9632a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2e6e5e" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#2e6e5e" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#2e6e5e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tileWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbf8f2"/>
    </linearGradient>
    <linearGradient id="tileOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec9367"/>
      <stop offset="100%" stop-color="#c2551e"/>
    </linearGradient>
    <linearGradient id="tileGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5fa193"/>
      <stop offset="100%" stop-color="#2e6e5e"/>
    </linearGradient>
    <linearGradient id="tileDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3833"/>
      <stop offset="100%" stop-color="#1b1a17"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#dotGrid)"/>
  <circle cx="660" cy="120" r="240" fill="url(#orangeGlow)"/>
  <circle cx="140" cy="490" r="220" fill="url(#greenGlow)"/>

  <g filter="url(#softShadow)" transform="rotate(-2 220 240)">
    <rect x="120" y="160" width="200" height="160" rx="14" fill="url(#tileOrange)"/>
    <rect x="140" y="180" width="50" height="14" rx="7" fill="#ffffff" fill-opacity="0.85"/>
    <text x="148" y="190" font-family="sans-serif" font-size="9" font-weight="700" fill="#c2551e">DENTAL</text>
    <text x="140" y="218" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Bondi Smile Clinic</text>
    <g transform="translate(140 232)" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-opacity="0.85">
      <path d="M 0 50 L 24 30 L 48 38 L 80 12 L 120 4 L 160 0"/>
      <line x1="0" y1="50" x2="160" y2="50" stroke-opacity="0.4"/>
    </g>
    <text x="140" y="306" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff">3.2x bookings</text>
  </g>

  <g filter="url(#softShadow)" transform="rotate(2 480 200)">
    <rect x="380" y="120" width="200" height="160" rx="14" fill="url(#tileWhite)" stroke="#ebe4d6"/>
    <rect x="400" y="140" width="60" height="14" rx="7" fill="#fbf2e8"/>
    <text x="408" y="150" font-family="sans-serif" font-size="9" font-weight="700" fill="#c2551e">SAAS</text>
    <text x="400" y="178" font-family="sans-serif" font-size="13" font-weight="700" fill="#1b1a17">Atlas FinTech</text>
    <g transform="translate(400 192)">
      <rect x="0" y="40" width="22" height="40" rx="3" fill="#d9632a" fill-opacity="0.85"/>
      <rect x="30" y="20" width="22" height="60" rx="3" fill="#d9632a"/>
      <rect x="60" y="32" width="22" height="48" rx="3" fill="#2e6e5e"/>
      <rect x="90" y="8" width="22" height="72" rx="3" fill="#2e6e5e"/>
      <rect x="120" y="0" width="22" height="80" rx="3" fill="#1b1a17"/>
      <line x1="0" y1="80" x2="160" y2="80" stroke="#1b1a17" stroke-opacity="0.18"/>
    </g>
  </g>

  <g filter="url(#softShadow)" transform="rotate(-1 200 420)">
    <rect x="100" y="350" width="200" height="160" rx="14" fill="url(#tileGreen)"/>
    <rect x="120" y="370" width="60" height="14" rx="7" fill="#ffffff" fill-opacity="0.85"/>
    <text x="126" y="380" font-family="sans-serif" font-size="9" font-weight="700" fill="#2e6e5e">SALON</text>
    <text x="120" y="408" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Glow Studios</text>
    <g transform="translate(120 422)">
      <circle cx="60" cy="40" r="40" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="10"/>
      <path d="M 60 0 A 40 40 0 0 1 96 60" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
      <text x="60" y="44" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffffff">68%</text>
      <text x="60" y="58" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#ffffff" fill-opacity="0.85">SHOW UP</text>
    </g>
  </g>

  <g filter="url(#softShadow)" transform="rotate(3 500 450)">
    <rect x="400" y="370" width="200" height="160" rx="14" fill="url(#tileDark)"/>
    <rect x="420" y="390" width="70" height="14" rx="7" fill="#d9632a"/>
    <text x="428" y="400" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff">REAL ESTATE</text>
    <text x="420" y="428" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Harbor Homes</text>
    <g transform="translate(420 442)" stroke="#d9632a" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M 0 50 L 30 40 L 60 28 L 90 32 L 120 14 L 160 4"/>
      <line x1="0" y1="50" x2="160" y2="50" stroke="#ffffff" stroke-opacity="0.18"/>
    </g>
    <text x="420" y="516" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff">$1.2M ARR</text>
  </g>

  <g fill="#d9632a">
    <circle cx="80" cy="100" r="3"/>
    <circle cx="720" cy="320" r="3"/>
  </g>
  <g fill="#2e6e5e">
    <circle cx="380" cy="480" r="3"/>
    <circle cx="700" cy="100" r="3"/>
  </g>
</svg>
