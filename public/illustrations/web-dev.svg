<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" role="img" aria-label="Web development browser and code illustration">
  <defs>
    <pattern id="dotGrid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2e6e5e" opacity="0.09"/>
    </pattern>
    <radialGradient id="orangeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d9632a" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#d9632a" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#d9632a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2e6e5e" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#2e6e5e" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#2e6e5e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="browserFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbf8f2"/>
    </linearGradient>
    <linearGradient id="codeFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3833"/>
      <stop offset="100%" stop-color="#1b1a17"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#dotGrid)"/>
  <circle cx="660" cy="120" r="240" fill="url(#orangeGlow)"/>
  <circle cx="140" cy="490" r="220" fill="url(#greenGlow)"/>

  <g filter="url(#softShadow)">
    <rect x="100" y="120" width="500" height="340" rx="12" fill="url(#browserFill)" stroke="#ebe4d6"/>
    <rect x="100" y="120" width="500" height="36" rx="12" fill="#fbf2e8"/>
    <path d="M 100 156 L 600 156" stroke="#ebe4d6"/>
    <circle cx="120" cy="138" r="5" fill="#e87564"/>
    <circle cx="138" cy="138" r="5" fill="#e8b343"/>
    <circle cx="156" cy="138" r="5" fill="#5fa193"/>
    <rect x="180" y="128" width="320" height="20" rx="10" fill="#ffffff" stroke="#ebe4d6"/>
    <text x="200" y="142" font-family="sans-serif" font-size="10" fill="#1b1a17" fill-opacity="0.6">https://digitalx-solutions.com</text>
    <circle cx="572" cy="138" r="6" fill="#2e6e5e"/>

    <rect x="120" y="180" width="120" height="6" rx="3" fill="#d9632a"/>
    <text x="120" y="220" font-family="sans-serif" font-size="22" font-weight="700" fill="#1b1a17">Sub-200ms sites</text>
    <text x="120" y="244" font-family="sans-serif" font-size="11" fill="#1b1a17" fill-opacity="0.55">Engineered for conversion, not decoration</text>

    <g transform="translate(120 270)">
      <rect width="220" height="120" rx="8" fill="#fbf2e8"/>
      <rect x="20" y="20" width="60" height="6" rx="3" fill="#d9632a"/>
      <rect x="20" y="36" width="180" height="4" rx="2" fill="#1b1a17" fill-opacity="0.18"/>
      <rect x="20" y="48" width="160" height="4" rx="2" fill="#1b1a17" fill-opacity="0.14"/>
      <rect x="20" y="76" width="80" height="20" rx="10" fill="#d9632a"/>
      <text x="60" y="90" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">Get started</text>
    </g>

    <g transform="translate(360 270)">
      <rect width="220" height="120" rx="8" fill="url(#codeFill)"/>
      <text x="20" y="32" font-family="monospace" font-size="11" fill="#5fa193">&lt;Hero</text>
      <text x="62" y="32" font-family="monospace" font-size="11" fill="#ec9367">title</text>
      <text x="92" y="32" font-family="monospace" font-size="11" fill="#ffffff" fill-opacity="0.6">=</text>
      <text x="100" y="32" font-family="monospace" font-size="11" fill="#fbf2e8">&quot;...&quot;</text>
      <text x="20" y="52" font-family="monospace" font-size="11" fill="#ec9367">  cta</text>
      <text x="50" y="52" font-family="monospace" font-size="11" fill="#ffffff" fill-opacity="0.6">=</text>
      <text x="58" y="52" font-family="monospace" font-size="11" fill="#fbf2e8">&quot;Book&quot;</text>
      <text x="20" y="72" font-family="monospace" font-size="11" fill="#5fa193">/&gt;</text>
      <text x="20" y="100" font-family="monospace" font-size="11" fill="#ffffff" fill-opacity="0.4">// LCP &lt; 1.2s</text>
    </g>

    <g transform="translate(120 410)">
      <rect width="460" height="34" rx="6" fill="#d8e7df"/>
      <circle cx="20" cy="17" r="9" fill="#2e6e5e"/>
      <path d="M 16 17 L 18 19 L 24 13" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="40" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#2e6e5e">Lighthouse 98 / 100 / 100 / 100</text>
    </g>
  </g>

  <g filter="url(#softShadow)" transform="translate(580 380)">
    <rect width="180" height="160" rx="14" fill="url(#codeFill)"/>
    <g transform="translate(20 24)">
      <text font-family="monospace" font-size="13" fill="#ec9367" font-weight="700">&lt;/&gt;</text>
    </g>
    <text x="20" y="74" font-family="sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.6">Tech stack</text>
    <g transform="translate(20 84)" font-family="sans-serif" font-size="11" font-weight="600">
      <rect width="60" height="20" rx="10" fill="#d9632a"/>
      <text x="30" y="14" text-anchor="middle" fill="#ffffff">Next.js</text>
      <rect x="68" width="60" height="20" rx="10" fill="#2e6e5e"/>
      <text x="98" y="14" text-anchor="middle" fill="#ffffff">RSC</text>
      <rect y="28" width="60" height="20" rx="10" fill="#ffffff" fill-opacity="0.85"/>
      <text x="30" y="42" text-anchor="middle" fill="#1b1a17">Edge</text>
      <rect x="68" y="28" width="80" height="20" rx="10" fill="#ffffff" fill-opacity="0.85"/>
      <text x="108" y="42" text-anchor="middle" fill="#1b1a17">Vercel</text>
    </g>
  </g>

  <g fill="#d9632a">
    <circle cx="80" cy="100" r="3"/>
    <circle cx="660" cy="180" r="3"/>
  </g>
  <g fill="#2e6e5e">
    <circle cx="80" cy="500" r="3"/>
    <circle cx="450" cy="500" r="3"/>
  </g>
</svg>
